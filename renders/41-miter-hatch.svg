<text x='366.0' y='398.0' font-size='8.5' fill='#4c1d95' text-anchor='middle' font-weight='normal' >DWS779 base 24-1/2 x 22</text>
<line x1='258.0' y1='371.0' x2='474.0' y2='371.0' stroke='#4c1d95' stroke-width='2' />
<text x='366.0' y='362.0' font-size='7' fill='#4c1d95' text-anchor='middle' font-weight='normal' >fence line</text>
<rect x='276.0' y='182.0' width='180.0' height='81.0' rx='0' fill='none' stroke='#9aa0a8' stroke-width='1' stroke-dasharray='4 3'/>
<text x='366.0' y='200.0' font-size='7' fill='#555' text-anchor='middle' font-weight='normal' >rails overhang the top (up) / point out the doors (stowed)</text>
<rect x='240.0' y='254.0' width='252.0' height='54.0' rx='0' fill='#7c3aed' stroke='#4c1d95' stroke-width='1' />
<text x='366.0' y='290.0' font-size='7.5' fill='#fff' text-anchor='middle' font-weight='normal' >hood 28 x 6 x 14, quick-connect 4&quot;</text>
<rect x='222.0' y='443.0' width='22.5' height='36.0' rx='0' fill='#e2c48f' stroke='#7a5c2e' stroke-width='1' />
<rect x='487.5' y='443.0' width='22.5' height='36.0' rx='0' fill='#e2c48f' stroke='#7a5c2e' stroke-width='1' />
<rect x='222.0' y='245.0' width='22.5' height='36.0' rx='0' fill='#e2c48f' stroke='#7a5c2e' stroke-width='1' />
<rect x='487.5' y='245.0' width='22.5' height='36.0' rx='0' fill='#e2c48f' stroke='#7a5c2e' stroke-width='1' />
<text x='217.5' y='240.5' font-size='7.5' fill='#7a5c2e' text-anchor='end' font-weight='normal' >rest blocks x4</text>
<circle cx='231.0' cy='416.0' r='5.40' fill='#dc2626' stroke='#7f1d1d' stroke-width='1' />
<circle cx='501.0' cy='416.0' r='5.40' fill='#dc2626' stroke='#7f1d1d' stroke-width='1' />
<rect x='217.5' y='299.0' width='27.0' height='18.0' rx='0' fill='#fbbf24' stroke='#713f12' stroke-width='1' />
<rect x='487.5' y='299.0' width='27.0' height='18.0' rx='0' fill='#fbbf24' stroke='#713f12' stroke-width='1' />
