<text x='217.5' y='311.6' font-size='7.5' fill='#713f12' text-anchor='end' font-weight='normal' >toggle clamps</text>
<line x1='235.5' y1='587.0' x2='496.5' y2='587.0' stroke='#555' stroke-width='0.8' />
