<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1180 660' width='1180' height='660' font-family='Inter, Helvetica, Arial, sans-serif'>
<rect width='1180' height='660' fill='#fbfbfa'/>
<text x='20.0' y='30.0' font-size='16' fill='#222' text-anchor='start' font-weight='bold' >SHEET 10  -  FLIP-TOP PLATFORM (plan) and the safety system</text>
<text x='20.0' y='50.0' font-size='11' fill='#555' text-anchor='start' font-weight='normal' >Two-sided platform: 2&quot; core (two 3/4 BB skins on 1/2 BB ribs) with the saw bolted to one face and a 4-1/2&quot; hollow flush box on the other. A 1&quot; steel axle in flange bearings on the bay walls. Both faces sit the same distance from the axle, so either way up is flush.</text>
<text x='1160.0' y='648.0' font-size='9' fill='#999' text-anchor='end' font-weight='normal' >workbench-plans  |  generated from tools/model.py  |  inches</text>
<rect x='150.0' y='128.0' width='432.0' height='432.0' rx='0' fill='#f1e2c2' stroke='#333' stroke-width='1' />
<rect x='222.0' y='146.0' width='288.0' height='405.0' rx='0' fill='none' stroke='#6d28d9' stroke-width='0.8' stroke-dasharray='4 3'/>
<text x='514.5' y='159.5' font-size='7.5' fill='#4c1d95' text-anchor='start' font-weight='normal' >bay walls (bearing blocks here)</text>
