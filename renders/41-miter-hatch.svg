<line x1='496.5' y1='583.0' x2='496.5' y2='591.0' stroke='#555' stroke-width='0.8' />
<rect x='354.2' y='575.0' width='23.7' height='15.0' rx='3' fill='#ffffffcc' stroke='none' stroke-width='1' />
<text x='366.0' y='584.0' font-size='9' fill='#555' text-anchor='middle' font-weight='normal' >29&quot;</text>
<line x1='604.5' y1='251.8' x2='604.5' y2='472.2' stroke='#555' stroke-width='0.8' />
<line x1='600.5' y1='251.8' x2='608.5' y2='251.8' stroke='#555' stroke-width='0.8' />
<line x1='600.5' y1='472.2' x2='608.5' y2='472.2' stroke='#555' stroke-width='0.8' />
<text x='600.5' y='362.0' font-size='9' fill='#555' text-anchor='middle' transform='rotate(-90 600.5 362.0)'>24-1/2"</text>
<text x='640.0' y='100.0' font-size='12' fill='#222' text-anchor='start' font-weight='bold' >How it stays safe</text>
<text x='640.0' y='122.0' font-size='10' fill='#333' text-anchor='start' font-weight='bold' >Load path</text>
<text x='720.0' y='122.0' font-size='9.5' fill='#333' text-anchor='start' font-weight='normal' >The platform seats on four maple rest blocks (both ways up); the axle only locates it.</text>
<text x='640.0' y='144.0' font-size='10' fill='#333' text-anchor='start' font-weight='bold' >Locate</text>
<text x='720.0' y='144.0' font-size='9.5' fill='#333' text-anchor='start' font-weight='normal' >Two 1/2&quot; spring index plungers snap into the bay walls at 0 and 180 deg.</text>
<text x='640.0' y='166.0' font-size='10' fill='#333' text-anchor='start' font-weight='bold' >Clamp</text>
<text x='720.0' y='166.0' font-size='9.5' fill='#333' text-anchor='start' font-weight='normal' >Two 500 lb hold-down toggle clamps pull the core onto the rest blocks. No rattle, no lift-off.</text>
<text x='640.0' y='188.0' font-size='10' fill='#333' text-anchor='start' font-weight='bold' >Interlock</text>
<text x='720.0' y='188.0' font-size='9.5' fill='#333' text-anchor='start' font-weight='normal' >A plunger seat switch under one rest block is in series with the paddle: no power unless seated and clamped.</text>
<text x='640.0' y='210.0' font-size='10' fill='#333' text-anchor='start' font-weight='bold' >Balance</text>
<text x='720.0' y='210.0' font-size='9.5' fill='#333' text-anchor='start' font-weight='normal' >~70 lb of steel plate in the flush box brings the saw side to within ~13 ft-lb of balance.</text>
<text x='640.0' y='232.0' font-size='10' fill='#333' text-anchor='start' font-weight='bold' >Swing</text>
<text x='720.0' y='232.0' font-size='9.5' fill='#333' text-anchor='start' font-weight='normal' >Doors open first; the saw swings out through the front. Keep 30&quot; clear. Two hands on the platform edges.</text>
<text x='640.0' y='254.0' font-size='10' fill='#333' text-anchor='start' font-weight='bold' >Saw</text>
<text x='720.0' y='254.0' font-size='9.5' fill='#333' text-anchor='start' font-weight='normal' >Head locked down, slide locked, bevel locked, blade guard closed before every flip. Checklist plate on the door.</text>
<text x='640.0' y='276.0' font-size='10' fill='#333' text-anchor='start' font-weight='bold' >Axle</text>
<text x='720.0' y='276.0' font-size='9.5' fill='#333' text-anchor='start' font-weight='normal' >1&quot; cold-rolled rod, two 1&quot; flange bearings on 1-1/2&quot; doubler blocks, shaft collars with set screws.</text>
<text x='640.0' y='298.0' font-size='10' fill='#333' text-anchor='start' font-weight='bold' >Hose / cord</text>
<text x='720.0' y='298.0' font-size='9.5' fill='#333' text-anchor='start' font-weight='normal' >4&quot; quick-connect cuff and a plug on the bay wall; connect after the plungers click in.</text>
<text x='640.0' y='328.0' font-size='9.5' fill='#b91c1c' text-anchor='start' font-weight='normal' >Verify before building: DWS779 locked-down height (21-1/2 assumed), deck height (4-1/2 assumed), base depth (22 assumed).</text>
</svg>