<text x='560.0' y='640.0' font-size='12' fill='#222' text-anchor='start' font-weight='bold' >Rules that make it pull</text>
<text x='560.0' y='660.0' font-size='9.5' fill='#333' text-anchor='start' font-weight='normal' >- Trunk: 4&quot; thin-wall PVC (S&amp;D) or 4&quot; spiral, straight, floor level.</text>
<text x='560.0' y='676.0' font-size='9.5' fill='#333' text-anchor='start' font-weight='normal' >- Branches: 45-deg wyes, never tees; 45-deg elbows in pairs instead of a 90.</text>
<text x='560.0' y='692.0' font-size='9.5' fill='#333' text-anchor='start' font-weight='normal' >- Blast gate at every drop (red squares). Open ONE 4&quot; gate at a time on the HF collector.</text>
<text x='560.0' y='708.0' font-size='9.5' fill='#333' text-anchor='start' font-weight='normal' >- Vac trunk: 2-1/2&quot; PVC with its own gates; the cyclone sits before the vac.</text>
<text x='560.0' y='724.0' font-size='9.5' fill='#333' text-anchor='start' font-weight='normal' >- Seal cabinets that duct through them: silicone the plenum, foam tape on doors.</text>
<text x='560.0' y='740.0' font-size='9.5' fill='#333' text-anchor='start' font-weight='normal' >- Router box: a 1&quot; x 4&quot; make-up-air slot near the door so it does not starve.</text>
<text x='560.0' y='756.0' font-size='9.5' fill='#333' text-anchor='start' font-weight='normal' >- Clean-outs: capped ends at the floor sweep and the utility corner.</text>
<text x='560.0' y='772.0' font-size='9.5' fill='#333' text-anchor='start' font-weight='normal' >- Never route the laser's exhaust into this system (fire risk).</text>
<text x='120.0' y='226.0' font-size='9' fill='#555' text-anchor='start' font-weight='normal' >north (table saw) is up</text>
</svg>