<text x='560.0' y='640.0' font-size='12' fill='#222' text-anchor='start' font-weight='bold' >Rules</text>
<text x='560.0' y='660.0' font-size='9.5' fill='#333' text-anchor='start' font-weight='normal' >- Everything stays 120 V / 20 A. Never run the router and the miter saw at the same time (each ~15 A).</text>
<text x='560.0' y='676.0' font-size='9.5' fill='#333' text-anchor='start' font-weight='normal' >- Main strip has the red master switch; paddle switches at router and miter are the tool switches.</text>
<text x='560.0' y='692.0' font-size='9.5' fill='#333' text-anchor='start' font-weight='normal' >- Cords are strapped to the raceway, never loose in the dust chase; use 12 AWG for the feed, 14 AWG branch strips.</text>
<text x='560.0' y='708.0' font-size='9.5' fill='#333' text-anchor='start' font-weight='normal' >- The miter cord makes a service loop with 30&quot; of slack for the lift travel.</text>
<text x='560.0' y='724.0' font-size='9.5' fill='#333' text-anchor='start' font-weight='normal' >- Charging drawer: switched outlet, 1&quot; vent slots front and back.</text>
<text x='560.0' y='740.0' font-size='9.5' fill='#333' text-anchor='start' font-weight='normal' >- Metal strips and boxes; screw the strips to plywood, not to the duct.</text>
